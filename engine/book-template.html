<style>
/* Layout: a picture-book spread; the scene fills the screen, the words sit on a paper strip for the grown-up to read. Single bright look by design. */
:root{

.tap{cursor:pointer}.nohit{pointer-events:none}
.anim{transform-box:fill-box;transform-origin:50% 100%}

@keyframes flapL{to{transform:rotate(-55deg)}}@keyframes flapR{to{transform:rotate(55deg)}}

@keyframes hide{0%{transform:scaleX(1)}25%,60%{transform:scaleX(.05)}85%{transform:scaleX(1.15)}100%{transform:scaleX(1)}}

button:focus-visible{outline:4px solid var(--red);outline-offset:3px}

.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}

.fxfly{animation:fxfly 2.4s ease-in forwards}@keyframes fxfly{to{transform:translate(var(--dx),var(--dy))}}

.fxsplat{animation:fxsplat .9s ease-out forwards}@keyframes fxsplat{0%{transform:translate(0,0) scale(.3);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1);opacity:0}}

.fxshades{animation:fxshades 2.6s ease-out forwards}@keyframes fxshades{0%{transform:translateY(-160px);opacity:0}25%{transform:translateY(0);opacity:1}80%{opacity:1}100%{opacity:0}}
.fxbow{transform-box:fill-box;transform-origin:50% 100%;animation:fxbow 3s ease-out forwards}@keyframes fxbow{0%{transform:scale(.2,0);opacity:0}25%{transform:scale(1);opacity:.9}75%{opacity:.9}100%{opacity:0}}
.fxacross{animation:fxacross 3.2s ease-in-out forwards}@keyframes fxacross{0%{transform:translate(0,0)}25%{transform:translate(calc(var(--dx)*.25),-40px)}50%{transform:translate(calc(var(--dx)*.5),10px)}75%{transform:translate(calc(var(--dx)*.75),-50px)}100%{transform:translate(var(--dx),var(--dy));opacity:0}}

.hover{animation:hover 2.6s ease-in-out infinite alternate}@keyframes hover{from{transform:translate(0,-6px)}to{transform:translate(0,10px)}}
.flapW{transform-box:fill-box;transform-origin:50% 100%;animation:flapW .12s linear infinite alternate}@keyframes flapW{to{transform:scaleY(.45)}}
.flutterW{transform-box:fill-box;animation:flutterW .5s ease-in-out infinite alternate}@keyframes flutterW{to{transform:scaleX(.55)}}

.rise{animation:rise 6s linear infinite}@keyframes rise{from{transform:translateY(0);opacity:0}10%{opacity:.8}to{transform:translateY(-700px);opacity:0}}
.wave{transform-box:fill-box;transform-origin:50% 100%;animation:wave 3.4s ease-in-out infinite alternate}@keyframes wave{from{transform:skewX(-6deg)}to{transform:skewX(6deg)}}
.glow{animation:glow 2.2s ease-in-out infinite alternate}@keyframes glow{from{opacity:.55}to{opacity:1}}
.clamOpen .lid{transform-box:fill-box;transform-origin:50% 100%;animation:lid 2.2s ease-in-out}@keyframes lid{0%,100%{transform:rotate(0)}25%,75%{transform:rotate(-38deg)}}
.scuttle{animation:scuttle 1.4s ease-in-out}@keyframes scuttle{0%,100%{transform:translateX(0)}25%{transform:translateX(70px)}50%{transform:translateX(-50px)}75%{transform:translateX(30px)}}
.fxink{transform-box:fill-box;transform-origin:50% 50%;animation:fxink 2.4s ease-out forwards}@keyframes fxink{0%{transform:scale(.2);opacity:.95}40%{transform:scale(1.4);opacity:.9}100%{transform:scale(2);opacity:0}}
#letter{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:4;min-width:84px;height:64px;padding:0 16px;border:5px solid var(--ink);border-radius:14px;

/* age dial: hold-to-press gates (a toddler's tap does nothing, a grown-up's hold fills the ring), the age screen, decoys and hints */

.sunb{width:clamp(64px,11vh,100px);aspect-ratio:1;border-radius:50%;border:5px solid var(--ink);background:#efe9d8;box-shadow:inset -14px -10px 0 #d6cfb8,4px 4px 0 var(--ink);
  font:400 clamp(30px,6vh,52px) Bangers,var(--display);color:#9a948a;position:relative;padding:0}

.autoT.on{background:#b7d88a;padding:10px 72px 10px 26px}.autoT.on::before{content:"☀️";left:auto;right:8px}
#ages small{display:block;margin-top:12px;opacity:.75;font-weight:600}

<svg id="stage" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid meet" aria-label="Picture book page">
  <defs>

function tone(f0,f1,dur,type='sine',vol=.22,delay=0){ const a=ctx(); if(!a||muted) return; const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();

  if(!_nb){ _nb=a.createBuffer(1,a.sampleRate*2,a.sampleRate); const d=_nb.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  const src=a.createBufferSource(); src.buffer=_nb; const fl=a.createBiquadFilter(); fl.type=type; fl.frequency.setValueAtTime(f,t); if(f2) fl.frequency.exponentialRampToValueAtTime(f2,t+dur); fl.Q.value=q;
  const g=a.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur); src.connect(fl).connect(g).connect(soundBus(a)); src.start(t,Math.random()); src.stop(t+dur+.02); }

/* ---- tag every kit piece so taps know what was touched; add sway, breathing and ground shadows ---- */
const INKED=[];
const SWAY=['tree','pine','flower'], BREATHE=['cow','pig','hen','duck','chick','frog','crab','octopus','clam'], SHADOW={crab:80,octopus:80,clam:70,hive:110,cow:110,pig:85,hen:55,duck:70,chick:40,frog:60,barn:180,hay:85,rock:50,potato:55,egg:36,scarecrow:70,bunny:45,tree:120,pine:100};
for(const name of Object.keys(P)){
  const orig=P[name]; if(typeof orig!=='function'||['sky','ground','hills','fence','stars','barnInside','leaf','button'].includes(name)) continue;
  P[name]=(...args)=>{
    const [x,y]=args; let inner=orig(...args);
    if(SWAY.includes(name)) inner=`<g class="sway" style="animation-duration:${(3+Math.random()*2).toFixed(1)}s;animation-delay:-${(Math.random()*3).toFixed(1)}s">${inner}</g>`;
    if(BREATHE.includes(name)) inner=`<g class="breathe" style="animation-delay:-${(Math.random()*3).toFixed(1)}s">${inner}</g>`;
    if(name==='cloud') inner=`<g class="drift" style="animation-delay:-${(Math.random()*10).toFixed(1)}s">${inner}</g>`;
    const sh=SHADOW[name]?`<ellipse class="nohit" cx="${x}" cy="${y+4}" rx="${SHADOW[name]}" ry="${(SHADOW[name]*.16).toFixed(0)}" fill="#2a1d16" opacity=".14"/>`:'';
    const ink=INKED.includes(name)?' filter="url(#ink)"':'';
    /* crosshatch shading: a copy of the drawing filled with hatching, faded in toward the lower right */
    if(ink){ const h=inner.replace(/class="tap[^"]*"/g,'class="nohit"').replace(/ stroke="[^"]*"| stroke-width="[^"]*"/g,'');
      inner=inner.replace(/<\/g><\/g>(?![\s\S]*<\/g><\/g>)/, m=>`<g class="nohit" mask="url(#shade)">${h.replace(/fill="(?!none)[^"]*"/g,'fill="url(#hatch)"').replace(/^[\s\S]*?<g class="anim[^"]*">/,'').replace(/<\/g><\/g>\s*$/,'')}</g><g class="nohit" mask="url(#shade2)">${h.replace(/fill="(?!none)[^"]*"/g,'fill="url(#hatch2)"').replace(/^[\s\S]*?<g class="anim[^"]*">/,'').replace(/<\/g><\/g>\s*$/,'')}</g>`+m); }
    return `<g class="actor" data-who="${name}" data-ax="${x}" data-ay="${y}">${sh}<g${ink}>${inner}</g></g>`;
  };
}
/* sky with a soft glow toward the horizon */

const _sun=P.sun; P.sun=(x,y)=>`<circle class="nohit" cx="${x}" cy="${y}" r="150" fill="#f6e3a8" opacity=".35"/>`+_sun(x,y);

/* ---- little effects, each removes itself ---- */
function addFx(html,ms){ const g=document.createElementNS('http://www.w3.org/2000/svg','g'); g.innerHTML=recolor(html); fx.appendChild(g); pace(g); setTimeout(()=>g.remove(),ms*PACE()); }
/* older child, calmer page: one-shot animations run faster (the endless ones, bobbing and blinking, are left alone) */
function pace(node){ const p=PACE(); if(p===1||!node.getAnimations) return; node.getAnimations({subtree:true}).forEach(a=>{ if(a.effect.getTiming().iterations!==Infinity) a.playbackRate=1/p; }); }
const rnd=(a,b)=>a+Math.random()*(b-a);
const tweet=()=>[0,.12,.3].forEach(d=>tone(2600,3400,.07,'sine',.12,d));

/* ---- painted backgrounds: a picture fills the scene; hotspots on it are shooting-gallery targets ---- */
/* the painting covers whatever part of the world is on screen; hotspot coordinates are in the picture's own pixels */
let PX, PY, PK, VIEW={x0:0,y0:170,x1:1600,y1:1170};
/* actors are placed as if on a 16:10 tablet (painting scale CK, offset COX/COY); on other screens they move and scale with the painting so they stay on the same painted spot */
const CK=1.225, COX=-92, COY=170, toPic=(x,y)=>[(x-COX)/CK,(y-COY)/CK];
function paintMap(d,focus){ const vw=VIEW.x1-VIEW.x0, vh=VIEW.y1-VIEW.y0; PK=Math.max(vw/d.w, vh/d.h);
  let ox=VIEW.x0+(vw-d.w*PK)/2; const oy=VIEW.y0+(vh-d.h*PK)*.6;
  if(focus!=null){ ox=VIEW.x0+vw/2-focus*PK; ox=Math.min(VIEW.x0,Math.max(VIEW.x1-d.w*PK,ox)); }
  PX=px=>ox+px*PK; PY=py=>oy+py*PK; }
const pts=a=>a.map(([x,y])=>`${PX(x).toFixed(0)},${PY(y).toFixed(0)}`).join(' ');
function painted(d,focus){
  paintMap(d,focus);
  let s=`<rect x="-3000" y="-3000" width="7600" height="3600" fill="${d.top||'#3f8f86'}"/><rect x="-3000" y="600" width="7600" height="4000" fill="${d.bottom||'#7d9a4f'}"/>
    <image id="paint" href="${d.src}" x="${PX(0)}" y="${PY(0)}" width="${d.w*PK}" height="${d.h*PK}" preserveAspectRatio="none"/>`;
  (d.hot||[]).forEach((h,i)=>{
    const shape=h.poly?`<polygon class="hot" points="${pts(h.poly)}"/>`:`<circle class="hot" cx="${PX(h.c[0])}" cy="${PY(h.c[1])}" r="${h.r*PK}"/>`;
    const c=h.c?[PX(h.c[0]),PY(h.c[1])]:center(h.poly);
    s+=`<g class="tap actor" data-hot="${i}" data-who="${h.who}" data-ax="${c[0]|0}" data-ay="${c[1]|0}">${shape}</g>`;
  });
  return s;
}
function center(poly){ const xs=poly.map(p=>PX(p[0])), ys=poly.map(p=>PY(p[1])); return [(Math.min(...xs)+Math.max(...xs))/2,(Math.min(...ys)+Math.max(...ys))/2]; }
function bounds(poly){ const xs=poly.map(p=>PX(p[0])), ys=poly.map(p=>PY(p[1])); return {x0:Math.min(...xs),x1:Math.max(...xs),y0:Math.min(...ys),y1:Math.max(...ys)}; }
function tween(ms,fn,done){ const t0=performance.now(); const step=t=>{ const k=Math.min(1,(t-t0)/ms); fn(k); if(k<1) requestAnimationFrame(step); else if(done) done(); }; requestAnimationFrame(step); }

  const cx=(bL.x0+bR.x1)/2, by=Math.max(bL.y1,bR.y1), dh=Math.max(bL.y1-bL.y0,bR.y1-bR.y0);

    <polygon points="${pts(L)}" fill="#24170f"/><polygon points="${pts(R)}" fill="#24170f"/>

function perches(page){ const list=(PERCH[page.scene]||[]).map(p=>({...p}));
  for(const a of page.actors||[]){ const on=ONTOP[a.who]; if(!on||a.hide) continue; const sc=(a.s||1)*(NOBIG.includes(a.who)?1:BIG);
    for(const o of on) list.push({x:a.x+o.dx*sc,y:a.y+o.dy*sc,open:o.open!==false,fit:o.fit,on:a.who}); }

/* which perch a critter gets: age 2 open spots only; 4 and 5 tucked-away spots first; a spot made for that critter wins; never one already taken or on top of another find */

  if(age>=4){ const h=c.filter(p=>!p.open); if(h.length) c=h; }
  const f=c.filter(p=>p.fit&&p.fit.includes(kind)); if(f.length) c=f;
  const p=c[Math.floor(Math.random()*c.length)]; p.used=true; return p; }

/* lay out a page's finds for the age: perch the coordinate-free ones, scatter decoys near each, add the covers of the perches used */
function layFinds(page,at){

  for(const f of fl) if(f.x==null){ const p=pickPerch(pool,f.kind,age,fl.filter(o=>o.x!=null)); if(p){ f.x=p.x; f.y=p.y; f.cover=p.cover; } else { f.x=800; f.y=930; } }

  const ch=$('choices');
  if(page.choice){
    ch.innerHTML=page.choice.options.map((o,i)=>`<button class="choice" data-go="${o.go}" aria-label="${o.label}">
      <svg viewBox="${focusView(o)}" preserveAspectRatio="xMidYMid slice">${thumb(o)}</svg><span>${o.label}</span></button>`).join('');
    ch.hidden=false; $('next').hidden=true;
  } else { ch.hidden=true; ch.innerHTML=''; $('next').hidden=!page.next && !page.end; }
  $('next').textContent=page.end?'↺':'▶';
  $('back').hidden=history.length===0;
}

const BURST_MS=TABLES.burstMs;
function burst(x,y,text,fill='#f6c84c',ink='#d0452f',size=54){ const w=Math.max(160,text.length*size*.62+60), h=size*2.1; let pts=[];
  for(let i=0;i<24;i++){ const a=i/24*Math.PI*2, r=i%2?0.8:1.1; pts.push(`${(Math.cos(a)*w/2*r).toFixed(0)},${(Math.sin(a)*h/2*r).toFixed(0)}`); }
  addFx(`<g transform="translate(${x} ${y}) rotate(${rnd(-7,7)|0})"><g class="pop"><polygon points="${pts.join(' ')}" fill="${fill}" ${S(6)}/>
    <text class="bubble" y="${size*.36}" text-anchor="middle" font-size="${size}" fill="${ink}" stroke="${OUT}" stroke-width="2.5" paint-order="stroke">${text}</text></g></g>`,BURST_MS); }
const SFXWORD={barn:['CREAK!',-400],cloud:['PITTER-PAT!',60],pond:['SPLASH!',-110],tree:['RUSTLE!',-420],pine:['RUSTLE!',-380],flower:['POP!',-150],hay:['SQUEAK!',-150],
  sun:['HELLO!',150],hive:['BZZZ!',-300],coral:['BLUB!',-220],kelp:['SWISH!',-360],clam:['SNAP!',-120],cabbage:['CRUNCH!',-140],carrot:['CRUNCH!',-120]};
/* counting: tap each animal of a kind and it gets a number */
const PLURAL={pig:'PIGS',hen:'HENS',chick:'CHICKS',duck:'DUCKS',cow:'COWS',fish:'FISH',crab:'CRABS',jelly:'JELLYFISH',beeBig:'BEES',butterfly:'BUTTERFLIES',frog:'FROGS',clam:'CLAMS',
  ladybug:'LADYBUGS',bee:'BEES',caterpillar:'CATERPILLARS',snail:'SNAILS',squid:'SQUID',starfish:'STARFISH',carrot:'CARROTS',flower:'FLOWERS'};
let counted={}, found=new Set();
function badge(x,y,n){ const g=document.createElementNS('http://www.w3.org/2000/svg','g'); g.setAttribute('class','nohit');
  g.innerHTML=`<g transform="translate(${x} ${y})"><g class="popin"><circle r="40" fill="#fff6d8" ${S(6)}/><text class="bubble" y="17" text-anchor="middle" font-size="52" fill="#d0452f">${n}</text></g></g>`; marks.appendChild(g); }
function countTap(kind,key,x,y,total){ if(total<2) return; const c=counted[kind]=counted[kind]||new Set(); if(c.has(key)) return; c.add(key); badge(x,y,c.size);
  tone(500+c.size*120,500+c.size*120,.15,'triangle',.07); if(c.size===total) setTimeout(()=>{ burst(x,y-130,`${total} ${PLURAL[kind]||kind.toUpperCase()}!`); sfx.fanfare(); },450); }
function huntLabel(page){ const f=finds(page), h=(page.actors||[]).filter(a=>a.hide); $('hunt').hidden=!(f.length||h.length);
  const fl=page.flaps||[]; if(fl.length) $('hunt').hidden=false;
  $('hunt').innerHTML=(fl.length?'Lift '+fl.map((x,i)=>`<span data-fl="${i}">${FLAP[x.type].icon}</span>`).join(' ')+' ':'')+(f.length||h.length?'Find ':'')+h.map(a=>`<span data-h="1">${a.icon||'👀'}</span>`).join(' ')+' '+f.map((it,i)=>`<span data-i="${i}">${FINDS[it[0]].icon}</span>`).join(' '); }
function animate(node,cls,ms=1200){ if(!node) return; node.classList.remove(cls); void node.getBBox(); node.classList.add(cls); pace(node); setTimeout(()=>node.classList.remove(cls),ms*PACE()); }
function bubble(x,y,text){
  text=text.toUpperCase(); const w=Math.max(150,text.length*27+50);
  addFx(`<g transform="translate(${x} ${y})"><g class="say"><path d="M0 0 l20 -40 h${w-20} a20 20 0 0 0 20 -20 v-60 a20 20 0 0 0 -20 -20 h-${w} a20 20 0 0 0 -20 20 v60 a20 20 0 0 0 20 20 z" fill="#ffffff" ${S(6)}/>
    <text class="bubble" x="${w/2}" y="-80" text-anchor="middle" font-size="50" fill="${OUT}">${text}</text></g></g>`,1700);
}

$('stage').addEventListener('pointerdown',e=>{
  ctx(); restartIdleHint(); const g=e.target.closest('.tap'); if(!g){ const w=toWorld(e); sparkle(w.x,w.y); return; }
  if(g.dataset.hot!=null){ gallery(g); return; }
  if(g.classList.contains('flapG')){ flipFlap(g); return; }
  if(g.classList.contains('decoy')){ animate(g.querySelector('.anim'),'nudge',500); return; }   // a look-alike: a gentle wobble and nothing else
  if(g.classList.contains('find')){ const kind=g.dataset.kind, F=FINDS[kind], i=[...world.querySelectorAll('.find')].indexOf(g), list=finds(BOOK.pages[cur]);
    animate(g.querySelector('.body'),F.anim,F.ms); F.snd();
    if(!found.has(i)){ found.add(i); const sp=$('hunt').querySelector(`[data-i="${i}"]`); if(sp) sp.classList.add('got');
      const m=g.transform.baseVal.consolidate().matrix; countTap(kind,i,m.e+60,m.f-70,list.filter(it=>it[0]===kind).length);
      if(found.size===list.length){ clearTimeout(hintT); clearTimeout(slowT); if(!hinted&&performance.now()-shownAt<=AUTO_QUICK_MS) grade(1);
        setTimeout(()=>{ burst(800,420,'YOU FOUND THEM!','#8fd3c4','#1d1a17',60); sfx.fanfare(); },900*PACE()); } }
    return; }
  const a=g.querySelector('.anim'); const actor=g.closest('.actor'); const who=actor&&actor.dataset.who, ax=actor?+actor.dataset.ax:800, ay=actor?+actor.dataset.ay:600;
  const hid=g.closest('[data-hide]'); if(hid && !hid.dataset.done){ hid.dataset.done=1; animate(a,'peekUp',2300); if(SOUND[who]) SOUND[who]();
    burst(ax,ay-(+hid.dataset.h||180)-120,hid.dataset.hide,'#8fd3c4','#1d1a17',58); const sp=$('hunt').querySelector('[data-h="1"]'); if(sp) sp.classList.add('got'); setTimeout(()=>sfx.fanfare(),300); return; }
  animate(a,g.dataset.react||'boing',1100);
  if(SOUND[who]) SOUND[who](); else if(g.dataset.sfx) sfx[g.dataset.sfx]();
  if(REACT[who]) REACT[who](ax,ay);
  if(SFXWORD[who]) burst(ax+(who==='sun'?-200:0), ay+SFXWORD[who][1], SFXWORD[who][0]);
  else if(g.dataset.bubble||g.dataset.say) bubble(ax+30, ay-(+g.closest('[data-h]')?.dataset.h||150), g.dataset.bubble||g.dataset.say.replace(/!.*$/,'!'));
  const holder=g.closest('[data-i]'); if(holder){ const kin=+holder.dataset.n; countTap(who,+holder.dataset.i,ax,ay-(+holder.dataset.h||180)-40,kin); }
});
/* lift the scene so the ground and characters always sit above the words strip, whatever the screen shape */
function layout(){
  const st=$('stage'), m=st.getScreenCTM(); const w=$('words');
  let T=170;
  if(m && !w.hidden){ const top=w.getBoundingClientRect().top; T=Math.round(965-(top-10-m.f)/m.d); }
  T=Math.max(170,Math.min(460,T));
  world.setAttribute('transform',`translate(0 ${-T})`); fx.setAttribute('transform',`translate(0 ${-T})`); marks.setAttribute('transform',`translate(0 ${-T})`);
  if(m){ VIEW={x0:(0-m.e)/m.a, x1:(innerWidth-m.e)/m.a, y0:(0-m.f)/m.d+T, y1:(innerHeight-m.f)/m.d+T};
    world.querySelectorAll('.find').forEach(g=>g.querySelector('.hit').setAttribute('r',hitR(+g.dataset.k||1))); }   // keep the finger target big when the screen changes
}
let rz; addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>{ const pd=BOOK.art&&BOOK.art[BOOK.pages[cur].scene]; if(pd) show(cur); else layout(); },150); });
$('next').onclick=()=>{ ctx(); const p=BOOK.pages[cur]; sfx.page();
  if(p.end){ history=[]; if(LIB.length>1) shelf(); else show(BOOK.start); return; } history.push(cur); show(p.next); if(BOOK.pages[cur].sound) sfx[BOOK.pages[cur].sound](); };
$('back').onclick=()=>{ ctx(); sfx.page(); if(history.length) show(history.pop()); };
$('choices').addEventListener('click',e=>{ const b=e.target.closest('.choice'); if(!b) return; ctx(); sfx.chime(); history.push(cur); show(b.dataset.go); });
document.addEventListener('contextmenu',e=>e.preventDefault());
$('anyway').onclick=()=>document.body.classList.add('anyway');
/* hold gates: Home, Mute and the gear need a held finger (1.2 s at age 2 and 3, 0.8 s at 4 and 5); a tap or a slip off the button does nothing */
function gate(btn,fn){ let t=0; const stop=()=>{ clearTimeout(t); t=0; btn.classList.remove('holding'); };
  btn.addEventListener('pointerdown',e=>{ e.preventDefault(); stop(); btn.style.setProperty('--hold',HOLDMS()+'ms'); btn.classList.add('holding'); t=setTimeout(()=>{ stop(); fn(); },HOLDMS()); });
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>btn.addEventListener(ev,stop)); }
gate($('mute'),()=>{ muted=!muted; $('mute').textContent=muted?'🔇':'🔊'; });
if(/debug/.test(location.search+location.hash)) document.body.classList.add('debug');
/* the age screen: a big number, four suns to pick from, auto on or off. Nothing else is stored. */
function ages(){ $('ages').hidden=false; drawAges(); }
function drawAges(){ $('ageNum').textContent=AGESET; $('ageRow').innerHTML=[2,3,4,5].map(n=>`<button class="sunb${n===AGESET?' on':''}" data-age="${n}" aria-label="Age ${n}">${n}</button>`).join('');
  $('autoBtn').textContent=AUTO?'Auto on':'Auto off'; $('autoBtn').classList.toggle('on',AUTO);
  $('ageNote').textContent=AUTO?`Auto nudges the finds a step easier or harder as she plays${OFFSET?` (right now: ${OFFSET>0?'a step harder':'a step easier'})`:''}.`:'The finds stay set for this age.'; }
$('ageRow').addEventListener('click',e=>{ const b=e.target.closest('[data-age]'); if(!b) return; ctx(); sfx.chime(); AGESET=+b.dataset.age; OFFSET=0;
  store.set('ssb.age',AGESET); store.set('ssb.autoOffset',0); drawAges(); });
$('autoBtn').onclick=()=>{ ctx(); sfx.pop(); AUTO=!AUTO; OFFSET=0; store.set('ssb.auto',AUTO?'1':'0'); store.set('ssb.autoOffset',0); drawAges(); };
$('ageDone').onclick=()=>{ ctx(); sfx.page(); $('ages').hidden=true; shelf(); };
$('ages').addEventListener('click',e=>{ if(e.target===$('ages')) $('ageDone').onclick(); });
gate($('gear'),()=>{ ctx(); sfx.chime(); ages(); });
function shelf(){ $('shelf').hidden=false; ['hunt','choices','letter'].forEach(i=>$(i).hidden=true); $('words').hidden=true; $('next').hidden=true; $('back').hidden=true; $('home').hidden=true; $('gear').hidden=false;
  clearTimeout(hintT); clearTimeout(slowT);
  const keep=BOOK; $('shelf').querySelector('.covers').innerHTML=LIB.map((b,i)=>{ BOOK=b; const c=b.pages[b.start];
    const svg=art({scene:c.scene,actors:c.actors}).replace(/class="tap[^"]*"/g,'class="nohit"');
    return `<button data-b="${i}" aria-label="${b.title}"><svg viewBox="${b.coverView||'100 250 1400 965'}" preserveAspectRatio="xMidYMid slice">${svg}</svg><span>${b.title}</span></button>`; }).join(''); BOOK=keep; }
$('shelf').addEventListener('click',e=>{ const b=e.target.closest('[data-b]'); if(!b) return; ctx(); sfx.chime(); BOOK=LIB[+b.dataset.b]; history=[]; show(BOOK.start); });
gate($('home'),()=>{ ctx(); sfx.page(); shelf(); });
$('letter').onclick=()=>{ ctx(); const L_=BOOK.pages[cur].letter; if(!L_) return; burst(800,330,`${L_[1]}  ${L_[2]}`,'#fff6d8','#d0452f',62); tone(660,880,.12,'triangle',.07); };
if(LIB.length>1) shelf(); else show(BOOK.start);
</script>
